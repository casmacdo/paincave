name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paincave-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run --workspace @paincave/worker cf-typegen

      - name: Build
        run: npm run build

      - name: Verify
        run: ./scripts/verify.sh --strict

      - name: Prepare production Worker config
        env:
          PAINCAVE_D1_DATABASE_ID: ${{ secrets.PAINCAVE_D1_DATABASE_ID }}
          BUILD_SHA: ${{ github.sha }}
        run: node scripts/prepare-wrangler-config.mjs

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply paincave-db --remote --config apps/worker/wrangler.local.jsonc

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config wrangler.local.jsonc --keep-vars --var APP_ENV:production --var BUILD_SHA:${{ github.sha }} --message "Deploy ${{ github.sha }}"

      - name: Verify deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 10); do
            response=$(curl --fail --silent --show-error --max-time 20 https://paincave.casmac.workers.dev/api/version || true)
            if printf '%s' "$response" | grep -qF "\"build_sha\":\"${EXPECTED_SHA}\""; then
              curl --fail --silent --show-error --max-time 20 https://paincave.casmac.workers.dev/ -o /dev/null
              printf 'Deployed %s successfully\n' "$EXPECTED_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "Deployment did not report the expected build SHA: ${EXPECTED_SHA}"
          exit 1
