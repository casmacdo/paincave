name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paincave-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preflight Cloudflare secrets and D1 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAINCAVE_D1_DATABASE_ID: ${{ secrets.PAINCAVE_D1_DATABASE_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAINCAVE_D1_DATABASE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          response=$(curl --silent --show-error --max-time 20 \
            -w $'\n%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${PAINCAVE_D1_DATABASE_ID}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"sql":"SELECT 1"}')
          http_code="${response##*$'\n'}"
          body="${response%$'\n'*}"

          if [ "$http_code" != "200" ] || ! printf '%s' "$body" | grep -q '"success":true'; then
            echo "::error::Cloudflare D1 preflight failed (HTTP ${http_code}). Ensure CLOUDFLARE_API_TOKEN is a Custom Token scoped to CLOUDFLARE_ACCOUNT_ID with Account -> D1: Edit, Workers Scripts: Edit, Workers R2 Storage: Edit, and Account Settings: Read."
            printf '%s\n' "$body"
            exit 1
          fi
          echo "Cloudflare D1 preflight check passed."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run --workspace @paincave/worker cf-typegen

      - name: Build
        run: npm run build

      - name: Verify
        run: ./scripts/verify.sh --strict

      - name: Prepare production Worker config
        env:
          PAINCAVE_D1_DATABASE_ID: ${{ secrets.PAINCAVE_D1_DATABASE_ID }}
          BUILD_SHA: ${{ github.sha }}
        run: node scripts/prepare-wrangler-config.mjs

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply paincave-db --remote -y --config apps/worker/wrangler.local.jsonc

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config wrangler.local.jsonc --keep-vars --var APP_ENV:production --var BUILD_SHA:${{ github.sha }} --message "Deploy ${{ github.sha }}"

      - name: Verify deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          APP_URL: ${{ vars.PAINCAVE_APP_URL || secrets.PAINCAVE_APP_URL }}
        run: |
          base_url="${APP_URL%/}"
          if [ -z "$base_url" ]; then
            echo "::warning::PAINCAVE_APP_URL is not configured in repository variables or secrets; skipping live /api/version verification."
            exit 0
          fi
          for attempt in $(seq 1 10); do
            response=$(curl --fail --silent --show-error --max-time 20 "${base_url}/api/version" || true)
            if printf '%s' "$response" | grep -qF "\"build_sha\":\"${EXPECTED_SHA}\""; then
              curl --fail --silent --show-error --max-time 20 "${base_url}/" -o /dev/null
              printf 'Deployed %s successfully\n' "$EXPECTED_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "Deployment did not report the expected build SHA: ${EXPECTED_SHA}"
          exit 1
